# ARTAL V8.6 — Sinkronisasi Google Sheets PUBLIC_JSON (CSV/Base64) -> GitHub Pages
# GANTI seluruh isi .github/workflows/sinkron-artal.yml dengan kode ini.
# Tanpa GitHub Personal Access Token; data Admin lama tidak diubah.
# Repository variable: ARTAL_CSV_URL = URL Publish to web, tab PUBLIC_JSON, format CSV.

name: Sinkronisasi ARTAL ke GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/sinkron-artal.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: artal-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Ambil data dan siapkan website
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode website ARTAL
        uses: actions/checkout@v4

      - name: Baca CSV PUBLIC_JSON dan validasi data ARTAL
        shell: bash
        env:
          ARTAL_CSV_URL: ${{ vars.ARTAL_CSV_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import csv
          import io
          import json
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          url = os.environ.get('ARTAL_CSV_URL', '').strip()
          parsed_url = urllib.parse.urlsplit(url)
          query = urllib.parse.parse_qs(parsed_url.query)
          if (parsed_url.scheme != 'https' or
              parsed_url.hostname != 'docs.google.com' or
              not parsed_url.path.startswith('/spreadsheets/d/') or
              not parsed_url.path.endswith('/pub') or
              'csv' not in [x.lower() for x in query.get('output', [])]):
              sys.exit('::error::ARTAL_CSV_URL harus URL Google Sheets Publish to web untuk PUBLIC_JSON format CSV (akhiran /pub?...output=csv).')

          EXPECTED = {
              'settings': dict,
              'slides': list,
              'agendas': list,
              'albums': list,
              'achievements': list,
              'news': list,
          }

          def load_csv_snapshot(content):
              if not content or len(content) > 10_000_000:
                  raise ValueError('CSV kosong atau melebihi ukuran aman')
              if content.lstrip().lower().startswith((b'<!doctype', b'<html')):
                  raise ValueError('Google mengembalikan HTML, bukan CSV')
              text = content.decode('utf-8-sig')
              rows = list(csv.reader(io.StringIO(text)))
              if not rows or not rows[0] or rows[0][0].strip() != 'ARTAL_PUBLIC_B64_V1':
                  raise ValueError('Header ARTAL_PUBLIC_B64_V1 tidak ditemukan; pastikan tab yang diterbitkan PUBLIC_JSON')
              chunks = []
              saw_blank = False
              for row in rows[1:]:
                  cell = (row[0] if row else '').strip()
                  if not cell:
                      saw_blank = True
                      continue
                  if saw_blank:
                      raise ValueError('Urutan potongan data Base64 terputus')
                  chunks.append(cell)
              if not chunks:
                  raise ValueError('Belum ada isi snapshot pada PUBLIC_JSON')
              try:
                  raw = base64.b64decode(''.join(chunks), validate=True)
                  data = json.loads(raw.decode('utf-8'))
              except (binascii.Error, UnicodeError, json.JSONDecodeError) as exc:
                  raise ValueError('Isi CSV tidak menghasilkan JSON ARTAL yang valid') from exc
              if not isinstance(data, dict):
                  raise ValueError('JSON harus berupa objek')
              for name, kind in EXPECTED.items():
                  if not isinstance(data.get(name), kind):
                      raise ValueError('Data ARTAL tidak memiliki struktur yang benar: ' + name)
              if not isinstance(data['settings'].get('site_name'), str) or not data['settings']['site_name'].strip():
                  raise ValueError('Nama website ARTAL kosong')
              return data, len(chunks)

          last_problem = 'belum ada tanggapan'
          for attempt in range(1, 5):
              print(f'Membaca CSV publik ARTAL — percobaan {attempt}/4', flush=True)
              try:
                  request = urllib.request.Request(url, headers={
                      'Accept': 'text/csv,text/plain,*/*',
                      'User-Agent': 'Mozilla/5.0 (compatible; ARTAL-Pages-Sync/8.6)',
                  })
                  with urllib.request.urlopen(request, timeout=75) as response:
                      final_host = urllib.parse.urlsplit(response.geturl()).hostname or '(unknown)'
                      code = response.status
                      content = response.read(10_000_001)
                  if final_host == 'accounts.google.com':
                      raise ValueError('Google mengarahkan permintaan CSV ke halaman login')
                  if code != 200:
                      raise ValueError('HTTP ' + str(code))
                  snapshot, n_chunks = load_csv_snapshot(content)
                  destination = pathlib.Path('_site/data/site.json')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_text(
                      json.dumps(snapshot, ensure_ascii=False, separators=(',', ':')),
                      encoding='utf-8',
                  )
                  print('BERHASIL: CSV publik dikonversi menjadi JSON ARTAL.', flush=True)
                  print('Potongan Base64:', n_chunks, flush=True)
                  for category in ('slides', 'agendas', 'albums', 'achievements', 'news'):
                      print(category + ': ' + str(len(snapshot[category])), flush=True)
                  break
              except (ValueError, urllib.error.URLError, TimeoutError, UnicodeError, OSError) as exc:
                  # Jangan mencetak URL lengkap ke GitHub logs.
                  last_problem = str(exc)
                  print('Peringatan:', last_problem, flush=True)
                  if attempt < 4:
                      time.sleep(10)
          else:
              sys.exit('::error::Gagal membaca DATA PUBLIK ARTAL setelah empat percobaan: ' + last_problem + '. Periksa ARTAL_CSV_URL dan tab PUBLIC_JSON yang dipublikasikan.')
          PY

      - name: Siapkan website ARTAL tanpa mengubah repository
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html || { echo '::error::index.html tidak ada di root repository.'; exit 1; }
          test -s _site/data/site.json || { echo '::error::site.json hasil sinkronisasi tidak tersedia.'; exit 1; }
          cp index.html _site/index.html
          if [ -f .nojekyll ]; then cp .nojekyll _site/.nojekyll; fi

      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website ARTAL
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Terbitkan website ARTAL
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
