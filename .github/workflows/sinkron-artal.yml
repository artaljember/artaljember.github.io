on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/sinkron-artal.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: artal-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Ambil data dan siapkan website
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode website ARTAL
        uses: actions/checkout@v4

      - name: Ambil JSON dan periksa domain akhir Google
        env:
          ARTAL_JSON_URL: ${{ vars.ARTAL_JSON_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data
          python3 - <<'PY'
          import json, os, pathlib, re, sys, time
          import urllib.request, urllib.error, urllib.parse

          url = os.environ.get('ARTAL_JSON_URL', '').strip()
          if not re.fullmatch(r'https://script\.google\.com/macros/s/[^/]+/exec(?:\?.*)?', url):
              sys.exit('::error::ARTAL_JSON_URL harus URL Apps Script /exec. Periksa Repository Variables.')

          expected = {'settings': dict, 'slides': list, 'agendas': list,
                      'albums': list, 'achievements': list, 'news': list}
          last = 'Tidak ada respons yang berhasil'

          def fetch(target):
              req = urllib.request.Request(target, headers={
                  'Accept': 'application/json,text/plain,*/*',
                  'User-Agent': 'Mozilla/5.0 (compatible; ARTAL-Public-Sync/8.4)'
              })
              try:
                  with urllib.request.urlopen(req, timeout=75) as resp:
                      return (resp.status, resp.geturl(), resp.headers.get_content_type(), resp.read(5_000_001))
              except urllib.error.HTTPError as err:
                  return (err.code, err.geturl(), err.headers.get_content_type(), err.read(2048))

          def parse(payload):
              if not payload or len(payload) > 5_000_000:
                  raise ValueError('kosong atau terlalu besar')
              data = json.loads(payload.decode('utf-8-sig'))
              if not isinstance(data, dict) or set(data) != set(expected):
                  raise ValueError('struktur objek JSON tidak sesuai')
              if any(not isinstance(data[k], typ) for k, typ in expected.items()):
                  raise ValueError('jenis data JSON tidak sesuai')
              if not data['settings'].get('site_name'):
                  raise ValueError('nama situs kosong')
              return data

          for attempt in range(1, 5):
              print(f'Meminta data ARTAL — percobaan {attempt}/4', flush=True)
              try:
                  code, final, ctype, payload = fetch(url)
              except Exception as exc:
                  last = f'Koneksi gagal ({type(exc).__name__})'
                  print('Diagnostik:', last, flush=True)
                  if attempt < 4: time.sleep(6)
                  continue

              final_host = urllib.parse.urlsplit(final).hostname or '(tidak diketahui)'
              # Hindari mencetak URL lengkap, query, deployment ID, atau isi respons ke log publik.
              try:
                  snapshot = parse(payload)
                  pathlib.Path('_site/data/site.json').write_text(
                      json.dumps(snapshot, ensure_ascii=False, separators=(',', ':')),
                      encoding='utf-8'
                  )
                  print('JSON ARTAL diterima dan valid.', flush=True)
                  break
              except (ValueError, UnicodeError, TypeError) as exc:
                  is_html = payload.lstrip().lower().startswith((b'<!doctype html', b'<html', b'<head')) or b'<html' in payload[:512].lower()
                  category = 'HTML' if is_html else 'non-JSON / skema tidak sesuai'
                  if final_host == 'accounts.google.com':
                      category += ' (halaman login Google)'
                  elif final_host == 'script.googleusercontent.com':
                      category += ' (respons layanan konten Google)'
                  elif final_host == 'script.google.com':
                      category += ' (halaman Apps Script, bukan data)'
                  last = f'HTTP {code}, host akhir {final_host}, jenis {ctype}, respons {category}'
                  print('Diagnostik:', last, flush=True)
                  # ContentService kadang menghasilkan pengalihan yang belum siap;
                  # coba URL pengalihan yang sama sekali lagi setelah jeda.
                  if is_html and final_host == 'script.googleusercontent.com':
                      time.sleep(4)
                      try:
                          _, _, _, payload2 = fetch(final)
                          snapshot = parse(payload2)
                          pathlib.Path('_site/data/site.json').write_text(
                              json.dumps(snapshot, ensure_ascii=False, separators=(',', ':')),
                              encoding='utf-8'
                          )
                          print('JSON diterima setelah mencoba ulang URL konten Google.', flush=True)
                          break
                      except Exception:
                          print('URL konten Google masih belum menghasilkan JSON.', flush=True)
                  if attempt < 4: time.sleep(6)
          else:
              sys.exit('::error::Sinkronisasi dihentikan dengan aman. ' + last +
                       '. Periksa apakah ARTAL_JSON_URL sama persis dengan URL /exec yang menampilkan JSON di Incognito. ' +
                       'Website publik yang sebelumnya sudah terbit tidak diubah.')
          PY

      - name: Tampilkan ringkasan konten valid
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open('_site/data/site.json', encoding='utf-8') as f:
              data = json.load(f)
          for name in ('slides', 'agendas', 'albums', 'achievements', 'news'):
              print(name + ': ' + str(len(data[name])))
          PY

      - name: Siapkan file website untuk diterbitkan
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html || { echo '::error::index.html tidak ditemukan di root repository.'; exit 1; }
          cp index.html _site/index.html
          if [ -f .nojekyll ]; then cp .nojekyll _site/.nojekyll; fi

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload berkas website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Terbitkan website ARTAL
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
