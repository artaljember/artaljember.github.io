# ARTAL V8.3 — Perbaikan sinkronisasi GitHub Pages tanpa Personal Access Token.
# Tempel seluruh isi ini ke: .github/workflows/sinkron-artal.yml
# Tidak perlu mengubah Apps Script Admin, Google Sheets, atau Google Drive.

name: Sinkronisasi ARTAL ke GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/sinkron-artal.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: artal-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Ambil data dan siapkan website
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode website ARTAL
        uses: actions/checkout@v4

      - name: Ambil dan validasi JSON Apps Script dengan percobaan ulang
        env:
          ARTAL_JSON_URL: ${{ vars.ARTAL_JSON_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ARTAL_JSON_URL:-}" ]]; then
            echo '::error::Repository variable ARTAL_JSON_URL belum diisi.'
            exit 1
          fi
          if [[ ! "$ARTAL_JSON_URL" =~ ^https://script\.google\.com/macros/s/[^/]+/exec([?].*)?$ ]]; then
            echo '::error::ARTAL_JSON_URL harus berupa URL Apps Script /exec, bukan /dev, GitHub, atau URL redirect sementara.'
            exit 1
          fi

          mkdir -p _site/data
          found=false
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Meminta JSON ARTAL — percobaan ${attempt}/8"
            temp_file="$(mktemp)"
            http_code="$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --location --silent --show-error \
              --connect-timeout 15 --max-time 75 \
              --header 'Accept: application/json,text/plain,*/*' \
              --user-agent 'ARTAL-Public-GitHubPages-Sync/8.3' \
              --output "$temp_file" --write-out '%{http_code}' \
              "$ARTAL_JSON_URL" || true)"

            if python3 - "$temp_file" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          try:
              if path.stat().st_size == 0 or path.stat().st_size > 5_000_000:
                  sys.exit(1)
              d = json.loads(path.read_text(encoding='utf-8-sig'))
              expected = {'settings': dict, 'slides': list, 'agendas': list, 'albums': list, 'achievements': list, 'news': list}
              if not isinstance(d, dict) or set(d) != set(expected):
                  sys.exit(1)
              if any(not isinstance(d[k], typ) for k, typ in expected.items()):
                  sys.exit(1)
              if not d['settings'].get('site_name'):
                  sys.exit(1)
          except (OSError, UnicodeError, ValueError, KeyError, TypeError):
              sys.exit(1)
          PY
            then
              mv "$temp_file" _site/data/site.json
              echo 'JSON ARTAL diterima dan tervalidasi.'
              found=true
              break
            fi

            # Jangan tampilkan isi respons atau URL Google di log publik.
            if [ -z "$http_code" ]; then http_code='tidak diketahui'; fi
            if head -c 150 "$temp_file" | grep -Eiq '<!doctype html|<html|<head|<body'; then
              echo "Peringatan: respons Google berupa HTML (HTTP ${http_code}), bukan JSON."
            else
              echo "Peringatan: respons tidak sesuai skema JSON ARTAL (HTTP ${http_code})."
            fi
            rm -f "$temp_file"
            if [ "$attempt" -lt 8 ]; then sleep 8; fi
          done

          if [ "$found" != true ]; then
            echo '::error::Delapan percobaan belum menghasilkan JSON ARTAL yang valid. Periksa URL /exec di ARTAL_JSON_URL, izin Anyone, dan status Apps Script pada Executions. Publikasi lama tidak diubah.'
            exit 1
          fi

      - name: Tampilkan ringkasan konten valid
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open('_site/data/site.json', encoding='utf-8') as f:
              data = json.load(f)
          for name in ('slides', 'agendas', 'albums', 'achievements', 'news'):
              print(name + ': ' + str(len(data[name])))
          PY

      - name: Siapkan file website untuk diterbitkan
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html || { echo '::error::index.html tidak ditemukan di root repository.'; exit 1; }
          cp index.html _site/index.html
          if [ -f .nojekyll ]; then cp .nojekyll _site/.nojekyll; fi

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload berkas website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Terbitkan website ARTAL
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
